# Ingress class and cert-manager issuer for every rendered Ingress.
ingressClassName: cilium
certIssuer: letsencrypt-prod

# The OIDC issuer oauth2-proxy authenticates against, e.g.
# `https://auth.example.com`. REQUIRED: rendering fails without it whenever
# `ingresses` is non-empty. Issuer-agnostic on purpose: this is the only line
# that changes when the IdP changes.
issuerUrl: ""
clientId: oauth2-proxy

# Cookie scope.
#
# Set to a parent domain (e.g. `.example.com`), one login covers every
# protected host under it - but the browser then sends that cookie to EVERY
# host in the domain, including services with nothing to do with auth. Two
# fleets' cookies together overran the 4096-byte default header buffer of an
# unrelated Fiber app, which answered 431 to every request until this was
# narrowed. The cost grows with each protected host and is paid by services
# that get no benefit from it.
#
# Leave EMPTY (the default) to omit the flag, and oauth2-proxy scopes the
# cookie to the request host by itself. Each protected host then keeps its
# own session, and SSO still works - the IdP's own session cookie means the
# extra hop is a silent redirect rather than a second login.
#
# IMPORTANT when this IS set to a shared parent: `cookie-secret` (see
# Credentials below) must be byte-identical in every namespace this chart is
# released into. A mismatched cookie-secret makes one proxy reject a cookie
# another proxy minted, which presents as an infinite redirect loop rather
# than a clear error.
cookieDomain: ""

# Domains oauth2-proxy will redirect to after login. Set it to your parent
# domain (e.g. `.example.com`) so post-login redirects across hosts work.
# Deliberately SEPARATE from cookieDomain: emptying that one scopes cookies per
# host, but the redirect whitelist must still span the domain or post-login
# redirects get rejected. Empty (the default) omits the flag.
whitelistDomain: ""

# Name of the session cookie oauth2-proxy sets. oauth2-proxy's own default is
# `_oauth2_proxy` for every instance, which is fine until two releases share a
# cookie domain: the browser keeps ONE cookie of a given name per domain, so the
# second fleet silently overwrites the first fleet's sessions.
#
# Give any fleet authenticating against a DIFFERENT issuer its own name. Paired
# with a different `existingSecret` (and therefore a different cookie-secret)
# that makes the two fleets mutually unreadable - which is what makes a login
# test meaningful, since otherwise a cookie minted against the old issuer
# decrypts fine and satisfies the new proxy without any login happening.
#
# Chart-wide on purpose: this identifies the fleet, not the host.
cookieName: _oauth2_proxy

# Secret in the release namespace holding keys `client-secret` and
# `cookie-secret`. Matches the sharkops-universal sidecar convention so a
# single secret-store path serves both.
existingSecret: oauth2-proxy-credentials

# Accept an id_token whose `email_verified` claim is false.
#
# Required for Authentik: its default "email" scope mapping hardcodes
# `email_verified: False`, because Authentik has no email-verification flow and
# will not assert what it cannot check. oauth2-proxy rejects such a token with
# "email in id_token (...) isn't verified" and returns 500 from /oauth2/callback
# - after a SUCCESSFUL login, so it reads as a proxy fault rather than a claim
# problem.
#
# "insecure" overstates it here: with --email-domain=* the email claim is not an
# authorization input at all. Trust comes from the issuer having authenticated
# the user. It would matter if access were granted by email address or domain,
# where an unverified address is an impersonation vector - so this stays
# opt-in, and off by default. (Being LAN-only would lower the stakes but is NOT
# the reason this is safe - the reason is that the claim gates nothing.)
allowUnverifiedEmail: false

# OIDC groups permitted to authenticate, chart-wide. Empty (the default)
# means every identity the issuer authenticates is admitted - with
# --email-domain=* hardcoded, the IdP's application policy is then the
# only gate. Settable per entry too; when an entry defines its own
# `allowedGroups` (even an empty list), that value wins for that host
# instead of this one. See the README's "Authorization" section.
allowedGroups: []

# Replicas per proxy Deployment, chart-wide default. Overridable per entry.
# Cookie-based sessions make this horizontally scalable for free, so bump
# it for an upstream where one pod going down (e.g. during a node drain)
# would take the only path to that UI with it.
replicas: 1

# Annotations applied to the Deployment's metadata (NOT the pod template -
# Reloader reads annotations off the Deployment object itself). The default
# restarts the proxy pods when the credentials Secret's content changes, so
# an external secret rotation actually takes effect. Inert if Reloader
# isn't installed in the cluster.
deploymentAnnotations:
  reloader.stakater.com/auto: "true"

image:
  repository: quay.io/oauth2-proxy/oauth2-proxy
  tag: v7.15.6
  pullPolicy: IfNotPresent

# Per-proxy pod resources. A release runs one proxy per protected host, so
# keep them small. No CPU limit - throttling a login path is worse than
# letting it burst.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# Pod-level securityContext (spec.template.spec.securityContext). Verified
# against quay.io/oauth2-proxy/oauth2-proxy:v7.9.0, which already runs as
# UID 65532 by default.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container-level securityContext for the oauth2-proxy container. Verified
# with a local `docker run --read-only --cap-drop=ALL` against
# quay.io/oauth2-proxy/oauth2-proxy:v7.9.0 - it starts cleanly under all
# three restrictions (no writes to disk in normal operation).
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# oauth2-proxy serves metrics ONLY when --metrics-address is set; without it
# there is no endpoint at all, so a ServiceMonitor alone collects nothing.
# These proxies sit in the auth path for every protected app, so a
# degradation here surfaces as "nobody can log in" rather than as an alert.
metrics:
  enabled: true
  port: 44180

# Pod DNS settings, applied to every proxy Deployment this chart renders.
#
# ndots:1 IS NOT COSMETIC WHERE `toFQDNs` IS IN PLAY. Cilium matches the DNS
# QUESTION NAME, and CoreDNS `autopath` answers the SEARCH-SUFFIXED question
# directly -- so at kubelet's default ndots:5 the bare name is never asked,
# Cilium never sees it, and an egress allowlist matches NOTHING while looking
# perfectly correct -- e.g. Alertmanager silently unable to reach its
# notification receivers.
#
# It must be 1 rather than 2: one-dot names (`gitlab.com`, `hc-ping.com`) still
# take the search path at 2.
#
# Left EMPTY by default so this chart's behaviour does not change for existing
# consumers. ndots changes only the ORDER names are tried in, never which can
# resolve, so setting it too low costs at most one extra lookup.
#
# dnsConfig:
#   options:
#     - name: ndots
#       value: "1"
dnsConfig: {}

# One entry per protected host. Each renders a Deployment, a Service and an
# Ingress. `name`, `host`, `tlsSecret` and `upstream` are required per
# entry - there is no safe default for any of them (an unset `tlsSecret`
# would render a certificate-less Ingress, an unset `host` would render an
# empty-host catch-all rule).
#
# ingresses:
#   - name: hubble-ui
#     host: hubble.example.com
#     tlsSecret: hubble-tls
#     upstream: http://hubble-ui.kube-system.svc.cluster.local:80
#     replicas: 2               # optional, overrides the chart-wide `replicas`
#     allowedGroups:            # optional, overrides the chart-wide `allowedGroups`
#       - admins
#     annotations:
#       gethomepage.dev/enabled: "true"
#       gethomepage.dev/name: Hubble
ingresses: []
