{{- range .Values.ingresses }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "oidc-proxy-ingress.labels" $ | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $.Values.certIssuer }}
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingressClassName }}
  tls:
    - secretName: {{ .tlsSecret }}
      hosts:
        - {{ .host }}
  rules:
    - host: {{ .host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "oidc-proxy-ingress.proxyName" .name }}
                port:
                  number: 80
{{- end }}
