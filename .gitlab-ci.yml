stages:
  - lint
  - test
  - package
  - deploy

variables:
  CHART_NAME: "oidc-proxy-ingress"

.helm_base: &helm_base
  image: alpine:latest
  before_script:
    - apk add --no-cache helm

.helm_with_curl: &helm_with_curl
  image: alpine:latest
  before_script:
    - apk add --no-cache helm curl git

.standard_rules: &standard_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint:
  <<: *helm_base
  stage: lint
  script:
    - helm lint .
    # Default values render zero documents (ingresses: []), so on their own
    # this job never actually exercises a template. Render examples/monitoring.yaml
    # too - it has two entries, so it also exercises the multi-entry path.
    - helm template test-release . --debug
    - helm template test-release . -f examples/monitoring.yaml --debug
  <<: *standard_rules

unit-tests:
  <<: *helm_with_curl
  stage: test
  script:
    - helm plugin install https://github.com/helm-unittest/helm-unittest
    - helm unittest --strict -f "tests/*.yaml" .
  <<: *standard_rules

package:
  <<: *helm_base
  stage: package
  script:
    - helm package .
    - ls -la *.tgz
  artifacts:
    paths:
      - "*.tgz"
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  <<: *helm_base
  stage: deploy
  before_script:
    - apk add --no-cache curl helm
  script:
    # helm package --version requires bare semver (e.g. "0.2.0"). A
    # v-prefixed tag (e.g. "v0.2.0") is passed through as-is and publishes
    # a chart literally versioned "v0.2.0", which most tooling won't treat
    # as equal to "0.2.0" - tag bare semver only.
    - helm package . --version $CI_COMMIT_TAG
    - CHART_FILE=$(ls *.tgz)
    - echo $CI_REGISTRY_PASSWORD | helm registry login registry.gitlab.com --username $CI_REGISTRY_USER --password-stdin
    - helm push $CHART_FILE oci://registry.gitlab.com/sharkops/helm-charts/oidc-proxy-ingress
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - package
