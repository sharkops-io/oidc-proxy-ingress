suite: oauth2-proxy deployment
templates:
  - deployment.yaml
# issuerUrl has no default and is required; every test that renders an entry
# needs one. Tests that care about its value override it.
set:
  issuerUrl: https://auth.example.com
tests:
  - it: should create no resources when ingresses is empty
    asserts:
      - hasDocuments:
          count: 0

  - it: should create one Deployment per entry, one for each distinct entry
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
        - name: longhorn-ui
          host: longhorn.example.com
          tlsSecret: longhorn-tls
          upstream: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
    asserts:
      - hasDocuments:
          count: 2
      # hasDocuments alone would pass for two identical documents; pin each
      # document's identity so the test actually distinguishes the entries.
      - equal:
          path: metadata.name
          value: hubble-ui-oauth2-proxy
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].args[3]
          value: --redirect-url=https://hubble.example.com/oauth2/callback
        documentIndex: 0
      - equal:
          path: metadata.name
          value: longhorn-ui-oauth2-proxy
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].args[3]
          value: --redirect-url=https://longhorn.example.com/oauth2/callback
        documentIndex: 1

  - it: should name the Deployment after the entry
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: metadata.name
          value: hubble-ui-oauth2-proxy
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: hubble-ui-oauth2-proxy
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: hubble-ui-oauth2-proxy

  - it: should derive the redirect URL from the host
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --redirect-url=https://hubble.example.com/oauth2/callback

  - it: should point the upstream at the entry's service
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --upstream=http://hubble-ui.kube-system.svc.cluster.local:80

  - it: should use the configured issuer and client id
    set:
      issuerUrl: https://login.example.com
      clientId: my-client
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oidc-issuer-url=https://login.example.com
      - contains:
          path: spec.template.spec.containers[0].args
          content: --client-id=my-client

  - it: should read both credentials from the existing secret
    set:
      existingSecret: my-creds
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: OAUTH2_PROXY_CLIENT_SECRET
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: my-creds
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: client-secret
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: OAUTH2_PROXY_COOKIE_SECRET
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.key
          value: cookie-secret

  - it: should set every security-relevant oauth2-proxy flag
    # Deleting any one of these from the template left all tests green
    # before this test existed - assert them explicitly.
    set:
      cookieDomain: .example.com
      whitelistDomain: .example.com
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --provider=oidc
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cookie-secure=true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --email-domain=*
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cookie-domain=.example.com
      - contains:
          path: spec.template.spec.containers[0].args
          content: --whitelist-domain=.example.com
      - contains:
          path: spec.template.spec.containers[0].args
          content: --reverse-proxy=true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --skip-provider-button=true

  - it: should expose the proxy on containerPort 4180
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 4180

  - it: should render into the release namespace
    release:
      namespace: my-namespace
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: metadata.namespace
          value: my-namespace

  - it: should omit --allowed-group entirely when allowedGroups is unset
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --allowed-group=

  - it: should render one --allowed-group per chart-wide group
    set:
      allowedGroups:
        - platform-admins
        - sre
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --allowed-group=platform-admins
      - contains:
          path: spec.template.spec.containers[0].args
          content: --allowed-group=sre

  - it: should let a per-entry allowedGroups override the chart-wide list
    set:
      allowedGroups:
        - platform-admins
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
          allowedGroups:
            - observability-team
        - name: longhorn-ui
          host: longhorn.example.com
          tlsSecret: longhorn-tls
          upstream: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --allowed-group=observability-team
        documentIndex: 0
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --allowed-group=platform-admins
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].args
          content: --allowed-group=platform-admins
        documentIndex: 1

  - it: should default to one replica, overridable per entry
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
        - name: longhorn-ui
          host: longhorn.example.com
          tlsSecret: longhorn-tls
          upstream: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
          replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 1
        documentIndex: 0
      - equal:
          path: spec.replicas
          value: 3
        documentIndex: 1

  - it: should honour an explicit replicas of 0 instead of falling back to the chart default
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
          replicas: 0
    asserts:
      - equal:
          path: spec.replicas
          value: 0
        documentIndex: 0

  - it: should apply the Reloader annotation to the Deployment metadata by default
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"

  - it: should apply the default pod and container securityContext
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL

  - it: should fail to render when an entry's name is missing
    set:
      ingresses:
        - host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - failedTemplate:
          errorMessage: "ingresses[].name is required"

  - it: should fail to render when an entry's host is missing
    set:
      ingresses:
        - name: hubble-ui
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - failedTemplate:
          errorMessage: 'ingresses[].host is required for entry "hubble-ui"'

  - it: should fail to render when an entry's upstream is missing
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
    asserts:
      - failedTemplate:
          errorMessage: 'ingresses[].upstream is required for entry "hubble-ui"'

  # Authentik's default "email" scope mapping hardcodes `email_verified: False`
  # - it has no email-verification flow, so it will not assert otherwise.
  # oauth2-proxy then refuses the token exchange with
  # "email in id_token (...) isn't verified" and serves a 500 from the callback,
  # AFTER a successful login, which makes it look like a proxy fault.
  - it: should not allow unverified email by default
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --insecure-oidc-allow-unverified-email=true

  - it: should allow unverified email when asked
    set:
      allowUnverifiedEmail: true
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --insecure-oidc-allow-unverified-email=true
      # The flag must not disturb the positional args other tests pin.
      - equal:
          path: spec.template.spec.containers[0].args[3]
          value: --redirect-url=https://hubble.example.com/oauth2/callback

  # Two proxy fleets pointed at different IdPs must not share a cookie name.
  # oauth2-proxy's default is _oauth2_proxy for every instance, so two releases
  # on one cookie domain overwrite each other's sessions - and, sharing a
  # cookie-secret, would each accept the other's cookie as valid.
  - it: should use the oauth2-proxy default cookie name unless overridden
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cookie-name=_oauth2_proxy

  - it: should render an overridden cookie name
    set:
      cookieName: _oauth2_proxy_authelia
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cookie-name=_oauth2_proxy_authelia
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --cookie-name=_oauth2_proxy
      # The flag must not disturb the positional args other tests pin.
      - equal:
          path: spec.template.spec.containers[0].args[3]
          value: --redirect-url=https://hubble.example.com/oauth2/callback

  # A cookie scoped to the parent domain is sent to EVERY host in it, including
  # services with no connection to auth. Two fleets' cookies together exceeded
  # the 4096-byte default header buffer of an unrelated Fiber app, which then
  # returned 431 to every request.
  - it: should scope the cookie to the parent domain when one is given
    set:
      cookieDomain: .example.com
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cookie-domain=.example.com

  - it: should omit --cookie-domain entirely when it is empty
    set:
      cookieDomain: ""
      whitelistDomain: .example.com
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --cookie-domain=
      # oauth2-proxy then scopes the cookie to the request host by itself.
      # The redirect whitelist must NOT collapse with it, or post-login
      # redirects to other hosts in the domain start being rejected.
      - contains:
          path: spec.template.spec.containers[0].args
          content: --whitelist-domain=.example.com

  - it: should omit --whitelist-domain entirely when it is empty
    set:
      whitelistDomain: ""
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --whitelist-domain=
          any: true

  # No default issuer: a guessed one would fail only at login time, as a
  # redirect to a host that is not the operator's IdP.
  - it: should fail to render an entry without issuerUrl
    set:
      issuerUrl: ""
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - failedTemplate:
          errorPattern: "issuerUrl is required"

  # oauth2-proxy v7.9.0 only serves metrics when --metrics-address is set -
  # without it there is no endpoint at all, so a ServiceMonitor alone
  # collects nothing. metrics.enabled defaults to true.
  - it: should set --metrics-address when metrics are enabled
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-address=[::]:44180

  - it: should render a configured metrics port in --metrics-address
    set:
      metrics:
        port: 9091
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-address=[::]:9091

  - it: should omit --metrics-address entirely when metrics are disabled
    set:
      metrics:
        enabled: false
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --metrics-address=

  - it: should expose a named metrics container port when enabled
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[1].name
          value: metrics
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 44180

  - it: should not add a metrics container port when disabled
    set:
      metrics:
        enabled: false
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http

  # dnsConfig is OMITTED unless set. This is the assertion that keeps the
  # default behaviour unchanged for existing consumers -- without it, a
  # `dnsConfig: {}` default could start rendering an empty `dnsConfig: {}` into
  # every pod spec and nothing would notice.
  - it: should not render dnsConfig when it is not set
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - notExists:
          path: spec.template.spec.dnsConfig

  # The load-bearing one. `ndots:1` is what makes a Cilium `toFQDNs` allowlist
  # match at all -- see the note in values.yaml. Asserting the VALUE, not just
  # that the key exists: an empty or wrong-valued dnsConfig renders fine and
  # fails only as a silent policy drop at runtime.
  - it: should render dnsConfig on every Deployment when set
    set:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
        - name: longhorn-ui
          host: longhorn.example.com
          tlsSecret: longhorn-tls
          upstream: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
    asserts:
      - equal:
          path: spec.template.spec.dnsConfig.options[0].name
          value: ndots
        documentIndex: 0
      - equal:
          path: spec.template.spec.dnsConfig.options[0].value
          value: "1"
        documentIndex: 0
      # BOTH documents, not just the first: the template is inside a `range`,
      # so a misplaced block could render it for one entry and not the other.
      - equal:
          path: spec.template.spec.dnsConfig.options[0].value
          value: "1"
        documentIndex: 1
