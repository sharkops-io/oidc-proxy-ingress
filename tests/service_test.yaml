suite: oauth2-proxy service
templates:
  - service.yaml
tests:
  - it: should create no resources when ingresses is empty
    asserts:
      - hasDocuments:
          count: 0

  - it: should create one Service per entry
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
        - name: longhorn-ui
          host: longhorn.example.com
          tlsSecret: longhorn-tls
          upstream: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
    asserts:
      - hasDocuments:
          count: 2

  - it: should select the matching proxy pods and map 80 to the named http port
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: metadata.name
          value: hubble-ui-oauth2-proxy
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: hubble-ui-oauth2-proxy
      - equal:
          path: spec.ports[0].port
          value: 80
      # Named port, not the numeric 4180 - it must match the container's
      # declared port name so it survives the container port ever changing.
      - equal:
          path: spec.ports[0].targetPort
          value: http

  - it: should render into the release namespace
    release:
      namespace: my-namespace
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: metadata.namespace
          value: my-namespace

  - it: should carry the fixed oauth2-proxy component label
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: oauth2-proxy

  - it: should fail to render when an entry's name is missing
    set:
      ingresses:
        - host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - failedTemplate:
          errorMessage: "ingresses[].name is required"
