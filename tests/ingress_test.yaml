suite: ingress
templates:
  - ingress.yaml
tests:
  - it: should create no resources when ingresses is empty
    asserts:
      - hasDocuments:
          count: 0

  - it: should create an Ingress for each entry
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
        - name: longhorn-ui
          host: longhorn.example.com
          tlsSecret: longhorn-tls
          upstream: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
    asserts:
      - hasDocuments:
          count: 2

  - it: should route to the entry's own oauth2-proxy service
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: hubble-ui-oauth2-proxy
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 80

  - it: should use the configured host and TLS secret
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: spec.rules[0].host
          value: hubble.example.com
      - equal:
          path: spec.tls[0].secretName
          value: hubble-tls
      - equal:
          path: spec.tls[0].hosts[0]
          value: hubble.example.com

  - it: should apply cert-manager annotation with the configured issuer
    set:
      certIssuer: letsencrypt-staging
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt-staging

  - it: should merge extra annotations from the ingress entry
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: Hubble
    asserts:
      - equal:
          path: metadata.annotations["gethomepage.dev/enabled"]
          value: "true"
      - equal:
          path: metadata.annotations["gethomepage.dev/name"]
          value: Hubble

  - it: should use the configured ingressClassName
    set:
      ingressClassName: nginx
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: should let an entry annotation override the chart cert-manager issuer
    set:
      certIssuer: letsencrypt-prod
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-staging
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt-staging

  - it: should not leak an entry's annotation override to other entries
    set:
      certIssuer: letsencrypt-prod
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-staging
        - name: longhorn-ui
          host: longhorn.example.com
          tlsSecret: longhorn-tls
          upstream: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
    asserts:
      # equal, not matchRegex - "longhorn-ui" contains no substring that
      # would make "hubble-ui" match it or vice versa, but matchRegex was
      # the wrong tool here regardless: it doesn't pin the value, so a name
      # like "not-hubble-ui-at-all" would also have passed.
      - equal:
          path: metadata.name
          value: hubble-ui
        documentIndex: 0
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt-staging
        documentIndex: 0
      - equal:
          path: metadata.name
          value: longhorn-ui
        documentIndex: 1
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt-prod
        documentIndex: 1

  - it: should quote a boolean annotation value rather than render it as YAML bool
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
          annotations:
            gethomepage.dev/enabled: true
    asserts:
      - equal:
          path: metadata.annotations["gethomepage.dev/enabled"]
          value: "true"

  - it: should render into the release namespace
    release:
      namespace: my-namespace
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: metadata.namespace
          value: my-namespace

  - it: should fail to render when an entry's name is missing
    set:
      ingresses:
        - host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - failedTemplate:
          errorMessage: "ingresses[].name is required"

  - it: should fail to render when an entry's host is missing
    set:
      ingresses:
        - name: hubble-ui
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - failedTemplate:
          errorMessage: 'ingresses[].host is required for entry "hubble-ui"'

  - it: should fail to render when an entry's tlsSecret is missing
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - failedTemplate:
          errorMessage: 'ingresses[].tlsSecret is required for entry "hubble-ui"'
