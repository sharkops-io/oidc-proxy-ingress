suite: oauth2-proxy servicemonitor
templates:
  - servicemonitor.yaml
tests:
  - it: should create no resources when ingresses is empty
    asserts:
      - hasDocuments:
          count: 0

  - it: should create no resources when metrics are disabled
    set:
      metrics:
        enabled: false
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - hasDocuments:
          count: 0

  - it: should create one ServiceMonitor per entry when metrics are enabled
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
        - name: longhorn-ui
          host: longhorn.example.com
          tlsSecret: longhorn-tls
          upstream: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: hubble-ui-oauth2-proxy
        documentIndex: 0
      - equal:
          path: metadata.name
          value: longhorn-ui-oauth2-proxy
        documentIndex: 1

  - it: should select the matching proxy's Service
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: hubble-ui-oauth2-proxy

  - it: should scrape the named metrics port
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: spec.endpoints[0].port
          value: metrics

  - it: should render into the release namespace
    release:
      namespace: my-namespace
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: metadata.namespace
          value: my-namespace

  # This cluster's Prometheus uses
  # serviceMonitorSelector: matchLabels{release: kube-prometheus-stack} with
  # an empty namespaceSelector. Without this label the object applies
  # cleanly and is silently never scraped.
  - it: should carry the release label this cluster's Prometheus requires
    set:
      ingresses:
        - name: hubble-ui
          host: hubble.example.com
          tlsSecret: hubble-tls
          upstream: http://hubble-ui.kube-system.svc.cluster.local:80
    asserts:
      - equal:
          path: metadata.labels["release"]
          value: kube-prometheus-stack
